spring:

  application:
    name: linkpulse

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/linkpulse}
    username: ${DB_USERNAME:linkpulse}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

security:
  jwt:
    secret: ${JWT_SECRET_BASE64}
    issuer: linkpulse
    access-token-ttl-seconds: 900

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cache:
    redirect-ttl: 5m